[project]
name = "student-crud-api"
version = "1.0.0"
description = "A REST API to manage student records"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.1.3",
    "Flask-Migrate>=4.1.0",
    "Flask-SQLAlchemy>=3.1.1",
    "SQLAlchemy>=2.0.50",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=8.4.2",
    "pytest-flask>=1.3.0",
]

[tool.uv]
package = false
