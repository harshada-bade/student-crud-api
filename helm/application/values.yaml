namespace: student-api

image:
  repository: harshadabade/student-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 5000
  nodePort: 30050

nodeSelector:
  type: application

env:
  logLevel: "INFO"

database:
  host: "postgresql.student-api.svc.cluster.local"
  port: 5432
  name: "students"
  user: "postgres"