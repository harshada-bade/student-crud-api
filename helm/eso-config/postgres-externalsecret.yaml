apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-external-secret
  namespace: student-api
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: postgresql-secret
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: student-api/postgres
        property: password